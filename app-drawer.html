<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111827">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="theme-color"
    content="#07111f">

<title>MARA OS — App Drawer</title>

<style>

/* =====================================================
   MARA OS — APP DRAWER
   HTML + CSS + JAVASCRIPT
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #07111f;
    color: #fff;

    user-select: none;
}


/* =====================================================
   APP DRAWER
===================================================== */

.mara-drawer {

    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #102844,
            #07111f 55%,
            #020811
        );

}


/* =====================================================
   BACKGROUND
===================================================== */

.drawer-background {

    position: absolute;
    inset: 0;

    background:

        radial-gradient(
            circle at 15% 10%,
            rgba(59,130,246,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(14,165,233,.20),
            transparent 35%
        );

    z-index: 0;

}

.drawer-overlay {

    position: absolute;
    inset: 0;

    background:
        rgba(0,0,0,.15);

    z-index: 1;

}


/* =====================================================
   TOP BAR
===================================================== */

.drawer-top {

    position: relative;
    z-index: 10;

    height: 72px;

    padding:
        15px 18px;

    display: flex;

    align-items: center;

    gap: 14px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button {

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 15px;

    color: #fff;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 20px;

    cursor: pointer;

}


.back-button:active {

    transform:
        scale(.92);

}


/* =====================================================
   TITLE
===================================================== */

.drawer-title {

    flex: 1;

}

.drawer-title h1 {

    font-size: 20px;

    font-weight: 600;

}

.drawer-title p {

    margin-top: 3px;

    font-size: 11px;

    opacity: .55;

}


/* =====================================================
   PROFILE
===================================================== */

.drawer-profile {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.15);

    font-size: 20px;

}


/* =====================================================
   SEARCH
===================================================== */

.drawer-search {

    position: relative;

    z-index: 10;

    margin:
        4px 18px 0;

    height: 48px;

    border-radius: 17px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        0 15px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(20px);

}


.drawer-search span {

    font-size: 18px;

    opacity: .7;

}


.drawer-search input {

    flex: 1;

    height: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: #fff;

    font-size: 14px;

}


.drawer-search input::placeholder {

    color:
        rgba(255,255,255,.55);

}


/* =====================================================
   CATEGORY
===================================================== */

.category-bar {

    position: relative;

    z-index: 10;

    display: flex;

    gap: 8px;

    padding:
        15px 18px 8px;

    overflow-x: auto;

    scrollbar-width: none;

}

.category-bar::-webkit-scrollbar {

    display: none;

}


.category-button {

    flex-shrink: 0;

    padding:
        9px 15px;

    border: none;

    border-radius: 14px;

    color: #fff;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size: 12px;

    cursor: pointer;

}


.category-button.active {

    background:
        rgba(59,130,246,.75);

    border-color:
        rgba(96,165,250,.8);

}


/* =====================================================
   APP CONTENT
===================================================== */

.drawer-content {

    position: relative;

    z-index: 5;

    height:
        calc(100% - 170px);

    overflow-y: auto;

    padding:
        10px 18px 30px;

    scrollbar-width: none;

}

.drawer-content::-webkit-scrollbar {

    display: none;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.apps-section-title {

    margin:
        10px 0 15px;

    font-size: 15px;

    font-weight: 600;

}


/* =====================================================
   APP GRID
===================================================== */

.apps-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        22px 12px;

}


/* =====================================================
   APP
===================================================== */

.drawer-app {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 7px;

    cursor: pointer;

}


.drawer-icon {

    width: 58px;
    height: 58px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 26px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.11);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.16);

    backdrop-filter:
        blur(12px);

    transition:
        transform .12s ease,
        background .15s ease;

}


.drawer-app:active
.drawer-icon {

    transform:
        scale(.88);

    background:
        rgba(255,255,255,.20);

}


.drawer-name {

    width: 80px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    text-align: center;

    font-size: 11px;

    opacity: .88;

}


/* =====================================================
   EMPTY SEARCH
===================================================== */

.empty-result {

    display: none;

    padding:
        50px 20px;

    text-align: center;

    opacity: .6;

}

.empty-result.active {

    display: block;

}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 600px) {

    .apps-grid {

        grid-template-columns:
            repeat(6, 1fr);

        gap:
            26px 20px;

    }

    .drawer-content {

        max-width:
            900px;

        margin:
            0 auto;

    }

}


@media (min-width: 1000px) {

    .apps-grid {

        grid-template-columns:
            repeat(8, 1fr);

    }

    .drawer-content {

        max-width:
            1150px;

    }

}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) {

    .apps-grid {

        grid-template-columns:
            repeat(6, 1fr);

    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    * {

        transition: none !important;
        animation: none !important;

    }

}

</style>

</head>


<body>

<script>

/* =====================================================
   MARA OS — APP DRAWER JS
===================================================== */


/* =====================================================
   ELEMENTS
===================================================== */

const searchInput =
    document.getElementById(
        "app-search"
    );

const apps =
    Array.from(
        document.querySelectorAll(
            ".drawer-app"
        )
    );

const categories =
    document.querySelectorAll(
        ".category-button"
    );

const emptyResult =
    document.getElementById(
        "empty-result"
    );

let currentCategory =
    "all";


/* =====================================================
   FILTER APPS
===================================================== */

function filterApps() {

    const query =
        searchInput.value
            .toLowerCase()
            .trim();

    let visible =
        0;


    apps.forEach(
        app => {

            const name =
                app.dataset.name
                    .toLowerCase();

            const category =
                app.dataset.category;


            const matchesSearch =
                name.includes(
                    query
                );


            const matchesCategory =
                currentCategory ===
                "all" ||
                category ===
                currentCategory;


            if (
                matchesSearch &&
                matchesCategory
            ) {

                app.style.display =
                    "flex";

                visible++;

            } else {

                app.style.display =
                    "none";

            }

        }
    );


    emptyResult.classList.toggle(
        "active",
        visible === 0
    );

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    filterApps
);


/* =====================================================
   CATEGORY
===================================================== */

categories.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                categories.forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add(
                    "active"
                );


                currentCategory =
                    this.dataset.category;


                filterApps();

            }
        );

    }
);


/* =====================================================
   OPEN APP
===================================================== */

apps.forEach(
    app => {

        app.addEventListener(
            "click",
            function() {

                const name =
                    this.dataset.name;

                openApp(name);

            }
        );

    }
);


function openApp(
    name
) {

    console.log(
        "Membuka:",
        name
    );

    alert(
        "Membuka " +
        name
    );

}


/* =====================================================
   BACK
===================================================== */

document
    .getElementById(
        "back-button"
    )
    .addEventListener(
        "click",
        function() {

            history.back();

        }
    );


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            history.back();

        }

    }
);


/* =====================================================
   PREVENT CONTEXT MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .then(() => {
                console.log("MARA OS Service Worker aktif");
            })
            .catch(error => {
                console.error("Service Worker gagal:", error);
            });
    });
}
</script>
</script>
